<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRETT Editor – HTML-Testversion</title>
<style>
:root{--bg:#09101f;--panel:#111a2e;--panel2:#17233c;--line:#2a3a5d;--text:#e8edf7;--muted:#91a0ba;--violet:#8b5cf6;--green:#22d3a6;--red:#fb7185}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 70% -15%,#2a1e64,transparent 38%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px}button:hover{border-color:var(--violet);background:#26355a}.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0f1729;overflow:auto;white-space:nowrap}.brand{font-weight:800;letter-spacing:.12em;color:#c4b5fd;margin-right:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}.primary{background:#432d88;border-color:#7653d4}.green{color:#86efac;border-color:#25634f}.workspace{display:grid;grid-template-columns:230px 1fr;gap:12px;padding:12px;min-height:0;flex:1}.side,.editor{background:rgba(17,26,46,.9);border:1px solid var(--line);border-radius:14px;overflow:hidden}.side-head,.editor-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.files{padding:10px}.file{padding:9px;border-radius:7px;color:#cbd5e1;cursor:pointer}.file:hover,.file.active{background:#26355a;color:#fff}.editor{display:flex;flex-direction:column}.editor-body{flex:1;min-height:0}.editor textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:18px;background:#0c1425;color:#e5e7eb;font:14px/1.6 Consolas,'JetBrains Mono',monospace}.status{padding:8px 12px;background:linear-gradient(90deg,#6542b5,#8b5cf6);font-size:12px}.terminal{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);width:min(1000px,94vw);height:min(480px,70vh);display:none;flex-direction:column;background:#070c17;border:1px solid #6145b6;border-radius:15px;box-shadow:0 25px 100px #000b}.terminal.open{display:flex}.term-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#121c33;border-bottom:1px solid var(--line)}.term-title{color:#ddd6fe;font-family:Consolas,monospace}.term-actions{display:flex;gap:6px}.term-out{flex:1;overflow:auto;padding:15px;color:#dbe4f5;white-space:pre-wrap;font:13px/1.55 Consolas,monospace}.term-out .muted{color:var(--muted)}.term-out .err{color:#fda4af}.term-row{display:flex;gap:8px;padding:11px;background:#101a30;border-top:1px solid var(--line)}.prompt{color:var(--green);font:bold 18px Consolas}.term-row input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:13px Consolas}.backdrop{position:fixed;inset:0;background:#02061199;display:none;z-index:4}.backdrop.open{display:block}@media(max-width:700px){.workspace{grid-template-columns:1fr}.side{display:none}.top{flex-wrap:wrap}.terminal{height:78vh}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="dot"></span>BRETT EDITOR</div><button onclick="newFile()">Neu</button><button onclick="openFile()">Öffnen</button><button class="primary" onclick="saveFile()">Speichern</button><button onclick="downloadProject()">Projekt herunterladen</button><button class="green" onclick="toggleTerminal()">⌘ Terminal</button><select id="language"><option>JavaScript</option><option>Python</option><option>HTML</option><option>CSS</option><option>JSON</option></select></header>
<main class="workspace"><aside class="side"><div class="side-head"><b>Dateien</b><span id="fileCount">1</span></div><div class="files" id="files"><div class="file active" onclick="selectFile(this,'index.html')">📄 index.html</div></div></aside><section class="editor"><div class="editor-head"><span id="filename">index.html</span><span id="saveState">bereit</span></div><div class="editor-body"><textarea id="code" spellcheck="false"><!doctype html>
<html>
  <body>
    <h1>Hello BRETT</h1>
  </body>
</html></textarea></div><div class="status">HTML-Testversion · Browser-Modus · Befehle im Terminal werden simuliert</div></section></main>
<div class="backdrop" id="backdrop" onclick="toggleTerminal(false)"></div><section class="terminal" id="terminal"><div class="term-head"><span class="term-title"><span class="dot"></span>BRETT TERMINAL · HTML TEST</span><div class="term-actions"><button onclick="clearTerminal()">Leeren</button><button onclick="stopCommand()">Stop</button><button onclick="toggleTerminal(false)">×</button></div></div><div class="term-out" id="termOut"><span class="muted">HTML-Testterminal bereit. Beispiele: npm install, npm run start, python -m http.server, dir, node --version</span></div><div class="term-row"><span class="prompt">›</span><input id="termInput" placeholder="Befehl eingeben …" autocomplete="off"></div></section><input type="file" id="fileInput" hidden>
<script>
const code=document.querySelector('#code'), term=document.querySelector('#terminal'), backdrop=document.querySelector('#backdrop'), out=document.querySelector('#termOut'), input=document.querySelector('#termInput'), fileInput=document.querySelector('#fileInput');
let history=[],hi=0, running=false;
code.addEventListener('input',()=>document.querySelector('#saveState').textContent='ungespeichert');
function write(text,cls=''){let d=document.createElement('div');d.className=cls;d.textContent=text;out.append(d);out.scrollTop=out.scrollHeight}
function toggleTerminal(open= !term.classList.contains('open')){term.classList.toggle('open',open);backdrop.classList.toggle('open',open);if(open)input.focus()}
function clearTerminal(){out.innerHTML=''} function stopCommand(){running=false;write('[Prozess beendet]','muted')}
function newFile(){if(confirm('Editor leeren?')){code.value='';document.querySelector('#filename').textContent='unbenannt.html';document.querySelector('#saveState').textContent='neu'}}
function openFile(){fileInput.click()}
fileInput.onchange=async e=>{let f=e.target.files[0];if(!f)return;code.value=await f.text();document.querySelector('#filename').textContent=f.name;document.querySelector('#saveState').textContent='geladen'}
function saveFile(){let blob=new Blob([code.value],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=document.querySelector('#filename').textContent||'index.html';a.click();document.querySelector('#saveState').textContent='gespeichert'}
function downloadProject(){saveFile();write('Projektdatei heruntergeladen.','muted')}
function selectFile(el,name){document.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelector('#filename').textContent=name}
function execute(cmd){let c=cmd.trim().toLowerCase();write('› '+cmd,'muted');if(!c)return;if(c==='clear'||c==='cls'){clearTerminal();return}if(c==='npm install'||c==='npm i'){write('npm notice\nadded 0 packages\nup to date, audited 0 packages','');return}if(c==='npm run start'||c==='npm start'){write('> brett-project@1.0.0 start\n> Starting development server…\n\nLocal: http://localhost:3000','');return}if(c.startsWith('python -m http.server')){write('Serving HTTP on 0.0.0.0 port 8000 …\nhttp://localhost:8000/','');return}if(c==='node --version'){write('v22.14.0','');return}if(c==='python --version'){write('Python 3.x','');return}if(c==='dir'||c==='ls'){write('index.html\npackage.json\nREADME.md','');return}if(c==='pwd'||c==='cd'){write('C:\\BRETT\\Projekt','');return}write('Befehl erkannt, aber in der HTML-Testversion nur simuliert: '+cmd,'err')}
input.addEventListener('keydown',e=>{if(e.key==='Enter'){let c=input.value;input.value='';history.push(c);hi=history.length;execute(c)}else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)hi--;input.value=history[hi]||''}else if(e.key==='ArrowDown'){e.preventDefault();if(hi<history.length)hi++;input.value=history[hi]||''}})
</script></body></html>
